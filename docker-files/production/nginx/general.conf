
    server {
        listen       80;
        server_name admin.ristopilot.com;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        client_max_body_size 100M;

        location ~ /.well-known/acme-challenge {
            allow all;
            root /var/www/certbot;
        }

        # redirect http to https www
        return 301 https://$server_name$request_uri;
    }


    server {
        #listen       443 ssl;
        listen       443 ssl;
        http2  on;
       
        server_name  admin.ristopilot.com;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        root         /var/www/html/public;
        index index.php;
        client_max_body_size 100M;
        proxy_connect_timeout   900s;
        proxy_send_timeout      900s;
        proxy_read_timeout      900s;

        # SSL code
        # ssl_certificate /etc/nginx/ssl/live/spilusi.com/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/live/spilusi.com/privkey.pem;
        ssl_certificate /etc/nginx/ssl/live/ristopilot.com/ristopilotcf.pem;
        ssl_certificate_key /etc/nginx/ssl/live/ristopilot.com/ristopilotkey.pem;

 

        location ~ /.well-known/acme-challenge {
            allow all;
            root /var/www/certbot;
        }

        # Redirects rules configuration
        include /etc/nginx/includes/redirects.include;

        # Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;
        location ~ ^(.+)/$ {
            return 301 https://$host$1;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass ristopilot-crm_php:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME     $request_filename;
            fastcgi_read_timeout 600;
        }

        location = / {
            try_files /page-cache/pc__index__pc.html /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /page-cache/$uri.html /page-cache/$uri.json /page-cache/$uri.xml /index.php?$query_string;
        }

