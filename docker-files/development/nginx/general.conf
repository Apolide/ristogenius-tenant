    server {
        listen       80;
        server_name  admin.ristopilot.local;
        root         /var/www/html/public;
        index index.php;

        # Redirects rules configuration
        include includes/redirects.include;

        # Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;
        client_max_body_size 100M;

            location ~ ^(.+)/$ {
                return 301 $scheme://$host$1;
            }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass ristopilot-crm_php:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME     $request_filename;
            fastcgi_read_timeout 600;
        }

        location = / {
            try_files /page-cache/pc__index__pc.html /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /page-cache/$uri.html /page-cache/$uri.json /page-cache/$uri.xml /index.php?$query_string;
        }


        # location / {
        #     #if ($request_uri ~ ^([^.]*[^/])$) {
        #     #    return 301 http://$host$request_uri/;
        #     #}
        #     #try_files $uri $uri/ /index.php?$query_string;
        #     rewrite ^(.+)/$ $1 permanent;
        #     #try_files $uri $uri/ /page-cache/$uri/pc__index__pc.html /index.php?$query_string;
        #     try_files $uri $uri/ /page-cache/pc__index__pc.html /index.php?$query_string;
        # }

        location = /ads.txt {
        allow all;
        log_not_found off;
        access_log off;
        }


        # location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        # expires 365d;
        # }

        location /img/ {
        allow all;
        }


    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_static on;
    gzip_disable "MSIE [1-6]\.";
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    }
