services:
  
  ristopilot-crm_database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: ${COMPOSE_PROJECT_NAME}_database
    ports:
      - "${DATABASE_PORT_HOST}:${DATABASE_PORT_CONTAINER}"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_DATABASE}
    networks:
      - ristopilot-crm


  ristopilot-crm_database_web_ui:
    image: phpmyadmin/phpmyadmin:${DATABASE_WEB_UI_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}_database_web_ui
    ports:
      - "${DATABASE_WEB_UI_PORT_HOST}:${DATABASE_WEB_UI_PORT_CONTAINER}"
    environment:
      PMA_HOST: ristopilot-crm_database
      UPLOAD_LIMIT: 300M
    depends_on:
      - ristopilot-crm_database
    networks:
      - ristopilot-crm


  #PHP
  ristopilot-crm_php:
    build:
      context: .
      dockerfile: php-dev-dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_php
    restart: unless-stopped
    tty: true
    depends_on:
      - ristopilot-crm_database
    environment:
      - DB_HOST=${DATABASE_HOST}
      - DB_PORT=${DATABASE_PORT_CONTAINER}
      - DB_USERNAME=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_DATABASE=${DATABASE_DATABASE}
    volumes:
      - ./code:/var/www/html
      - ./certificates:/var/www/html/certificates
    networks:
      - ristopilot-crm

  #Nginx
  ristopilot-crm_nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8002:80"
    volumes:
      - ./docker-files/development/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker-files/development/nginx/general.conf:/etc/nginx/conf.d/default.conf
      - ./docker-files/development/nginx/includes/:/etc/nginx/includes/
      - ./code:/var/www/html
      - ./certificates:/etc/nginx/ssl/live/ristopilot.com
    networks:
      - ristopilot-crm

  ristopilot-crm_redis:
    image: redis:6.2.6
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    command: redis-server --include /usr/local/etc/redis/redis.conf
    volumes:
      - ./docker-files/development/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - ristopilot-crm

  ristopilot-crm_mailhog:
    platform: linux/x86_64
    image: mailhog/mailhog
    container_name: ${COMPOSE_PROJECT_NAME}_mailhog
    logging:
      driver: 'none'
    ports:
      - "8103:1025"
      - "8100:8025"
    networks:
      - ristopilot-crm      

#Networks
networks:
  ristopilot-crm:
    driver: bridge
    name: ristopilot-crm_network

#Volumes
volumes:
  dbdatacrm:
    driver: local
